name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip \
            --output /tmp/kotlin.zip
          echo "473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d  /tmp/kotlin.zip" \
            | sha256sum -c -
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: make check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-check
